<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Frontend Design — Hero 示例</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.pexels.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Bitter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f14;
      --text: #f4f6f8;
      --muted: #9aa3ad;
      --accent: #ff6b4a;
      --accent-2: #4ecdc4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Bitter', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 4rem 1.5rem;
    }

    .hero__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.55;
      filter: saturate(0.85) contrast(1.1);
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(78, 205, 196, 0.2), transparent 50%),
                  linear-gradient(180deg, rgba(11, 15, 20, 0.3) 0%, rgba(11, 15, 20, 0.85) 100%);
      pointer-events: none;
    }

    .hero__content {
      position: relative;
      z-index: 1;
      max-width: 760px;
      text-align: center;
    }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(244, 246, 248, 0.2);
      border-radius: 999px;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .hero__badge svg {
      width: 16px;
      height: 16px;
      color: var(--accent-2);
    }

    .hero__title {
      font-family: 'Bodoni Moda', 'Times New Roman', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
    }

    .hero__title span {
      color: var(--accent);
    }

    .hero__desc {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--muted);
      margin-bottom: 2.5rem;
      max-width: 560px;
      margin-inline: auto;
    }

    .hero__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      border-radius: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn--primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 12px 32px rgba(255, 107, 74, 0.35);
    }

    .btn--ghost {
      border: 1px solid rgba(244, 246, 248, 0.2);
      color: var(--text);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <section class="hero">
    <!-- 来自 Pexels 的真实摄影背景 -->
    <img
      class="hero__image"
      src="https://images.pexels.com/photos/2680270/pexels-photo-2680270.jpeg?auto=compress&cs=tinysrgb&w=1920"
      srcset="
        https://images.pexels.com/photos/2680270/pexels-photo-2680270.jpeg?auto=compress&cs=tinysrgb&w=640 640w,
        https://images.pexels.com/photos/2680270/pexels-photo-2680270.jpeg?auto=compress&cs=tinysrgb&w=1280 1280w,
        https://images.pexels.com/photos/2680270/pexels-photo-2680270.jpeg?auto=compress&cs=tinysrgb&w=1920 1920w
      "
      sizes="100vw"
      alt=""
      loading="eager"
      decoding="async"
    />
    <div class="hero__overlay" aria-hidden="true"></div>

    <div class="hero__content">
      <div class="hero__badge">
        <!-- Lucide: Sparkles -->
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
        全新升级的设计规范
      </div>

      <h1 class="hero__title">
        用真实摄影与<br />
        <span>专业图标</span>打造界面
      </h1>

      <p class="hero__desc">
        不再依赖 Emoji 与单调渐变。super-frontend-design 让每一个页面都配有 Pexels 专业图片与 Lucide / Tabler 矢量图标。
      </p>

      <div class="hero__actions">
        <a href="#" class="btn btn--primary">
          开始使用
          <!-- Lucide: ArrowRight -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
          </svg>
        </a>
        <a href="#" class="btn btn--ghost">
          查看文档
          <!-- Lucide: ArrowUpRight -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 7h10v10"/><path d="M7 17 17 7"/>
          </svg>
        </a>
      </div>
    </div>
  </section>
</body>
</html>
